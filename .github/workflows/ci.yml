name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same branch/PR to save free CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Dummy values — never real secrets — good enough for lint/typecheck/build
  # and for a throwaway Postgres service container that only this job sees.
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/watchtower?schema=public
  AUTH_SECRET: ci-only-secret-not-for-production-use-1234567890
  NEXTAUTH_URL: http://localhost:3000
  SEED_ADMIN_EMAIL: admin@watchtower.local
  SEED_ADMIN_PASSWORD: ChangeMe123!

jobs:
  web:
    name: web (lint, typecheck, unit, build, e2e)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: watchtower
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Lint
        run: npm run lint --workspace=apps/web

      - name: Typecheck
        run: npm run typecheck --workspace=apps/web

      - name: Unit tests
        run: npm run test --workspace=apps/web

      - name: Worker unit tests + typecheck
        run: |
          npm run test --workspace=apps/worker
          npm run build --workspace=apps/worker

      - name: Apply migrations to the CI database
        run: npm run prisma:migrate:deploy --workspace=apps/web

      - name: Seed the CI database
        run: npm run prisma:seed --workspace=apps/web

      - name: Build
        run: npm run build --workspace=apps/web

      - name: Install Playwright browser
        run: npx --workspace=apps/web playwright install --with-deps chromium

      - name: Run e2e tests against the production build
        run: npm run e2e --workspace=apps/web

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

  api:
    name: api (ruff, mypy, pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: apps/api/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Ruff
        run: ruff check app tests

      - name: Mypy
        run: mypy app --ignore-missing-imports

      - name: Pytest
        run: pytest -q

  security:
    name: security (npm audit, dependency review, semgrep)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      # Fails the build on new HIGH/CRITICAL advisories in production
      # dependencies only — dev-only tooling advisories (see README's
      # "Known limitations" section) don't block CI.
      - name: npm audit (production dependencies)
        run: npm audit --omit=dev --audit-level=high
      - name: Dependency review (pull requests only)
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@v5
      - name: Semgrep static analysis
        uses: semgrep/semgrep-action@v1
        with:
          config: p/owasp-top-ten p/javascript p/typescript p/python p/secrets
